</style></head><body><header id="top"><small>MYEONGDOJAE · WOLCHON STATION PEOPLE</small><h1>이성두 시인 문학관</h1></header><main><a class="back" href="./index.html">← 월촌역 사람들 공동 문학관</a><section class="intro"><h2>시인 소개</h2><p>시집 『별꽃은 피고 지고』를 중심으로 시인의 문학 세계를 소개하는 개인 문학관입니다.</p><p class="note">사용자가 제공한 『별꽃은 피고 지고』 제1부 교정 초고에서 대표 시를 선정해 원문을 수록했습니다. 최종 출판본과 교열이 필요합니다.</p></section><section class="box"><h2>📖 작품 감상</h2><div id="tabs" class="tabs"></div><div class="controls"><button id="prev" class="secondary">이전 작품</button><button id="next" class="secondary">다음 작품</button><button id="small" class="secondary">글자 작게</button><button id="large" class="secondary">글자 크게</button></div><div class="book" id="reading-book"><article class="page"><h3 id="title"></h3><div id="verse" class="verse"></div><div class="controls audio-controls"><button id="read" type="button">▶ 시 읽기</button><button id="stop" type="button" class="secondary">■ 정지</button></div><p id="count" class="note"></p></article><article class="page"><h3>작품 해설</h3><div id="comment" class="verse"></div><div class="controls"><button id="readcomment" type="button">▶ 해설 읽기</button></div><p class="note">명도재 문학관 · 작품 해설</p></article></div><figure class="poem-mosaic" aria-label="선택한 작품의 모자이크 시화"><div id="poem-mosaic-art" class="mosaic-image"></div><figcaption id="poem-mosaic-label">작품별 디지털 모자이크 시화</figcaption><div class="mosaic-top-actions"><a class="mosaic-to-top" href="#top" aria-label="문학관 맨 위로 이동">↑ 맨 위로 가기</a></div></figure></section></main><footer>© 2026 명도재(明道齋) · 기획 이명우</footer><script src="./mosaic-art.js" defer></script><script>const poet={"slug":"lee-seongdu","name":"이성두","subtitle":"별꽃은 피고 지고","bio":"시집 『별꽃은 피고 지고』를 중심으로 시인의 문학 세계를 소개하는 개인 문학관입니다.","works":["보리 보리 쌀","선물","낮별"],"poem":"","comment":"「보리 보리 쌀」은 유년의 손놀이를 통해 되돌릴 수 없는 관계의 상실을 노래한다. ‘두 손바닥’과 ‘작은 주먹’의 움직임은 경쾌하지만, ‘잡힐 듯 말 듯’한 몸짓에는 붙잡을 수 없는 시간의 속성이 스민다. 놀이 구호 뒤에 등장하는 ‘마지막 치맛자락’은 즐거움이 그리움으로 바뀌는 지점이다. 화자가 ‘미화야’ 하고 이름을 불러도 돌아오는 것은 대답이 아니라 붉은 노을이다. ‘빈손’에 노을만 ‘잡힌다’는 역설은 사라진 사람 대신 기억의 빛깔이 남아 있음을 보여 준다. 처마 밑 저녁 풍경과 짧게 끊긴 행은 어린 날의 박자와 부르다 멈춘 이름의 숨결을 함께 전한다. 상실을 설명하기보다 손짓과 색채로 느끼게 하는 절제된 서정이 돋보인다."};const registeredWorks=[{"title":"보리 보리 쌀","poem":"두 손바닥을 벌리면\n잡힐 듯 말 듯\n끝내 달아나던\n작은 주먹\n\n보리, 보리, 쌀!\n\n마지막 치맛자락도 놓치고\n돌아선 자리\n\n해 질 녘 처마 밑\n아직도 네 웃음이 튄다\n\n미화야\n부르면\n빈손에\n노을만 붉게 잡힌다","comment":"「보리 보리 쌀」은 유년의 손놀이를 통해 되돌릴 수 없는 관계의 상실을 노래한다. ‘두 손바닥’과 ‘작은 주먹’의 움직임은 경쾌하지만, ‘잡힐 듯 말 듯’한 몸짓에는 붙잡을 수 없는 시간의 속성이 스민다. 놀이 구호 뒤에 등장하는 ‘마지막 치맛자락’은 즐거움이 그리움으로 바뀌는 지점이다. 화자가 ‘미화야’ 하고 이름을 불러도 돌아오는 것은 대답이 아니라 붉은 노을이다. ‘빈손’에 노을만 ‘잡힌다’는 역설은 사라진 사람 대신 기억의 빛깔이 남아 있음을 보여 준다. 처마 밑 저녁 풍경과 짧게 끊긴 행은 어린 날의 박자와 부르다 멈춘 이름의 숨결을 함께 전한다. 상실을 설명하기보다 손짓과 색채로 느끼게 하는 절제된 서정이 돋보인다."},{"title":"선물","poem":"대명동 수용소\n다닥다닥 붙은 집들\n\n단칸 셋방에\n김 열 장처럼\n누워 있던 방\n\n영철이 방 같은 김\n서른 봉이 왔다\n\n겹겹이 쌓아보니\n비어 있던 배가 아니라\n시간이 내려앉는다\n\n얇은 것들이\n이토록 무겁다","comment":"「선물」은 김이라는 얇은 사물을 통해 가난했던 생활의 기억과 시간의 무게를 되살린다. ‘대명동 수용소’와 ‘단칸 셋방’은 추상적인 향수가 아닌 구체적인 삶의 현장이다. 여러 사람이 ‘김 열 장처럼’ 누워 있던 방의 비유는 공간의 비좁음과 고단함을 감각적으로 드러낸다. 선물로 받은 김을 겹겹이 쌓는 순간, 화자에게 내려앉는 것은 허기가 아니라 오래전의 시간이다. 마지막 ‘얇은 것들이 / 이토록 무겁다’는 역설은 작품 전체를 관통한다. 물질의 무게와 기억의 무게가 서로 반대 방향으로 움직이기 때문이다. 소박한 먹을거리는 사람들과 함께 견딘 세월의 증표가 된다. 시는 가난을 미화하지 않으면서도 사소한 선물이 간직한 삶의 밀도와 인간적 온기를 보여 준다."},{"title":"낮별","poem":"낮별이 머물던 자리\n월촌역 7번 출구\n커피가 식는 동안\n말은 끝내 떠오르지 않았다\n\n꽃향기만 남아\n별빛 하나\n잠깐\n사람의 얼굴을 빌리고 있을 때\n\n우리는\n걸음을 늦춘 것이 아니라\n이미\n지나간 쪽에서\n돌아오지 못하고 있었다","comment":"「낮별」은 보이지 않아도 사라지지 않는 별의 속성으로 관계의 부재와 기억의 지속을 그린다. ‘월촌역 7번 출구’는 시적 그리움을 현실의 장소에 정착시키며, ‘커피가 식는 동안’은 침묵 속에서 흐르는 시간을 온도로 느끼게 한다. 끝내 떠오르지 않은 말 대신 꽃향기와 별빛이 잠시 사람의 얼굴을 빌린다. 이 장면은 부재한 존재가 감각의 흔적으로 되살아나는 순간이다. 독립된 행 ‘잠깐’은 그 만남이 얼마나 짧은지 강조한다. 후반부에서 화자는 걸음이 느린 것이 아니라 이미 지나간 시간에서 돌아오지 못하고 있음을 깨닫는다. 낮에 보이지 않는 별처럼 마음에 남은 관계도 눈에 보이지 않을 뿐 지속된다. 구체적인 도시 풍경과 환상적인 이미지가 만나는 시다."}];registeredWorks.push(...[{"title":"우편함","poem":"기쁜 날에도 슬픈 날에도\n빈 봉투 하나에\n\n한 장 두 장\n더 넣었다 덜 넣었다\n\n어떤 날은 가볍고\n어떤 날은 무겁다\n\n마음 하나 꼬깃꼬깃\n봉투 속에 접어 넣으며\n\n남의 기쁨과 슬픔을\n몇 번이나 다녀왔을까\n\n빈 우편함을 열어보니\n\n문득\n우편함이 외롭다","comment":"「우편함」은 편지라는 일상적인 매체를 통해 사람들 사이를 오간 감정의 무게를 조명한다. ‘한 장 두 장 / 더 넣었다 덜 넣었다’는 동작에는 전하고 싶은 말과 망설임이 함께 담긴다. 가볍고 무거운 봉투의 차이는 종이의 양을 넘어 기쁨과 슬픔의 차이로 확장된다. ‘꼬깃꼬깃’ 접힌 마음은 종이의 주름에 삶의 흔적을 새긴다. 화자가 ‘남의 기쁨과 슬픔을 / 몇 번이나 다녀왔을까’ 하고 묻는 순간, 우편함은 소식을 받는 물건에서 타인의 삶을 품은 존재로 변한다. 마지막 ‘우편함이 외롭다’는 진술은 사람의 감정이 사물에 옮겨지는 의인화이다. 편지가 사라진 빈자리에서 오히려 관계의 소중함이 선명해지는 작품이다."},{"title":"향기의 행방","poem":"한 시간 남짓 가면\n보랏빛 유채꽃이 있다길래\n영천까지 갔네\n\n유채꽃 술렁이고 작약이며 양귀비\n저마다 한창이라\n\n거기 월촌역 시인들\n꽃보다 먼저 들떠\n꽃노래 콧노래 흥얼거리네\n\n나는 아이처럼\n공짜 향기라고 마구마구\n주머니에 집어넣었는데\n\n돌아오는 주머니\n향기는 온데간데없고\n\n어디서 묻었는지\n웃음 하나\n아직도 향기롭다","comment":"「향기의 행방」은 꽃구경의 즐거움을 사람과 사람이 나눈 웃음의 향기로 바꾸는 작품이다. 영천의 유채꽃과 작약, 양귀비는 화려한 봄 풍경을 열어 주지만, 시의 중심은 꽃보다 먼저 들뜬 ‘월촌역 시인들’에게 있다. 화자는 아이처럼 ‘공짜 향기’를 주머니에 마구 담는다. 이 천진한 상상은 돌아오는 길 향기가 사라졌다는 사실과 맞물려 작은 반전을 만든다. 꽃향기는 붙잡을 수 없으나 함께 웃었던 기억은 남아 있기 때문이다. 결말의 ‘웃음 하나 / 아직도 향기롭다’는 후각을 인간관계의 정서로 바꾸는 감각적 전이다. 여행에서 얻은 가장 값진 선물은 꽃 자체가 아니라 그것을 함께 바라본 시간이다. 소박한 유머와 따뜻한 우정이 어우러진 밝은 서정시이다."},{"title":"산바람에 귀를 대고","poem":"가창 우록 가는 길섶\n\n흙냄새\n젖은 바람\n숨결까지 맑아진다\n\n박새들 날갯짓에\n구슬 한 주먹 차르르\n맑다\n\n여린 잎조차 없는 가지\n끝마다 조랑조랑\n분홍 옹알이 피어나\n\n말보다 먼저 봄을 배운다\n\n소리 따라\n어린 날 웃음이 번지고\n\n나, 이제\n산바람에 귀를 댄다","comment":"「산바람에 귀를 대고」는 봄을 시각보다 청각과 촉각으로 먼저 발견하는 작품이다. ‘가창 우록 가는 길섶’이라는 구체적 장소에서 흙냄새와 젖은 바람이 화자의 감각을 깨운다. 박새의 날갯짓은 ‘구슬 한 주먹 차르르’라는 청각적 이미지로 바뀌고, 잎조차 돋지 않은 가지에는 ‘분홍 옹알이’가 피어난다. 꽃망울을 어린아이의 첫말로 표현한 이 이미지에는 새 생명의 시작을 반기는 마음이 담겼다. ‘말보다 먼저 봄을 배운다’는 구절은 자연을 설명하기보다 온몸으로 받아들이려는 시적 태도를 드러낸다. 끝에서 산바람에 귀를 대는 행위는 작고 여린 소리에 주의를 기울이는 자세이다. 자연과 유년의 기억을 연결한 감각적 서정이 돋보인다."}]);poet.works=registeredWorks.map(w=>w.title);let idx=0,size=16;const el=id=>document.getElementById(id);function draw(){el('tabs').innerHTML='';poet.works.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w;b.className=i===idx?'':'secondary';b.type='button';b.setAttribute('aria-pressed',String(i===idx));b.onclick=()=>{if(idx===i){document.getElementById('reading-book').scrollIntoView({behavior:'smooth',block:'start'});return;}stopAudio();idx=i;draw();document.getElementById('reading-book').scrollIntoView({behavior:'smooth',block:'start'})};el('tabs').append(b)});const w=poet.works[idx];el('title').textContent=poet.name+' · '+w;el('verse').textContent=registeredWorks[idx].poem;el('comment').textContent=registeredWorks[idx].comment;el('count').textContent=(idx+1)+' / '+poet.works.length;el('verse').style.fontSize=size+'px';el('comment').style.fontSize=size+'px';if(window.MyeongdoMosaic){window.MyeongdoMosaic.render(el('poem-mosaic-art'),poet.slug,idx,w);el('poem-mosaic-label').textContent='「'+w+'」 · 디지털 모자이크 시화';}}let activeAudio=null,activeType=null,audioState='idle',audioChunks=[],audioChunkIndex=0,audioOffset=0,audioToken=0;
function audioButtonState(){
 const poem=el('read'),comment=el('readcomment');
 const label=(type,name)=>activeType===type&&audioState==='playing'?'⏸ '+name+' 일시정지':activeType===type&&audioState==='paused'?'▶ '+name+' 이어 읽기':'▶ '+name+' 읽기';
 poem.textContent=label('poem','시');comment.textContent=label('comment','해설');
 poem.setAttribute('aria-pressed',String(activeType==='poem'&&audioState==='playing'));
 comment.setAttribute('aria-pressed',String(activeType==='comment'&&audioState==='playing'));
}
function splitForSpeech(text){
 const pieces=[];
 // 짧은 문장과 행으로 나누어, 모바일 엔진이 pause 상태를 지워도
 // 마지막 발화 지점부터 복원할 수 있도록 한다.
 for(const line of text.split(/\n+/)){
  const trimmed=line.trim();if(!trimmed)continue;
  const sentences=trimmed.match(/[^.!?。！？]+[.!?。！？]*\s*/g)||[trimmed];
  for(const s of sentences){
   let rest=s.trim();
   while(rest.length>75){
    let cut=rest.lastIndexOf(' ',75);
    if(cut<25)cut=75;
    pieces.push(rest.slice(0,cut).trim());
    rest=rest.slice(cut).trim();
   }
   if(rest)pieces.push(rest);
  }
 }
 return pieces;
}
function clearSpeech(){
 activeAudio=null;activeType=null;audioState='idle';audioChunks=[];audioChunkIndex=0;audioOffset=0;audioToken++;
 if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}
 audioButtonState();
}
function playSpeechChunk(){
 if(audioState!=='playing')return;
 if(audioChunkIndex>=audioChunks.length){clearSpeech();return;}
 const chunk=audioChunks[audioChunkIndex];
 const start=Math.max(0,Math.min(audioOffset,chunk.length));
 const remaining=chunk.slice(start);
 if(!remaining.trim()){audioChunkIndex++;audioOffset=0;playSpeechChunk();return;}
 const token=++audioToken;
 const u=new SpeechSynthesisUtterance(remaining);
 u.lang='ko-KR';u.rate=.87;
 const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));if(voices.length)u.voice=voices[0];
 u.onboundary=e=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  if(typeof e.charIndex==='number')audioOffset=Math.max(audioOffset,start+e.charIndex);
 };
 u.onend=()=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  activeAudio=null;audioChunkIndex++;audioOffset=0;playSpeechChunk();
 };
 u.onerror=()=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  // 오류가 나면 처음부터 재생하지 않도록 기존 진행 위치를 유지한다.
  activeAudio=null;audioState='paused';audioButtonState();
 };
 activeAudio=u;audioButtonState();
 try{speechSynthesis.speak(u)}catch(e){activeAudio=null;audioState='paused';audioButtonState()}
}
function toggleAudio(type){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert('음성 읽기를 지원하지 않습니다. 크롬에서 열어 주세요.');return;}
 if(activeType===type&&audioState==='playing'){
  // Android Chrome에서 pause/resume이 멈출 수 있어 현재 위치를 기억하고
  // 발화를 취소한다. 다음 클릭은 그 위치부터 새로운 발화로 시작한다.
  audioState='paused';activeAudio=null;audioToken++;
  try{speechSynthesis.cancel()}catch(e){}
  audioButtonState();return;
 }
 if(activeType===type&&audioState==='paused'){
  audioState='playing';audioButtonState();playSpeechChunk();return;
 }
 clearSpeech();
 const text=(type==='poem'?el('verse'):el('comment')).textContent;
 audioChunks=splitForSpeech(text);if(!audioChunks.length)return;
 activeType=type;audioState='playing';audioChunkIndex=0;audioOffset=0;
 audioButtonState();playSpeechChunk();
}

el('readcomment').onclick=()=>toggleAudio('comment');
el('stop').onclick=clearSpeech;
document.querySelector('.mosaic-to-top').addEventListener('click',()=>{
 clearSpeech();
 document.querySelectorAll('audio').forEach(a=>{try{a.pause();a.currentTime=0}catch(e){}});
});
window.addEventListener('pagehide',clearSpeech);
el('prev').onclick=()=>{stopAudio();idx=(idx-1+poet.works.length)%poet.works.length;draw()};el('next').onclick=()=>{stopAudio();idx=(idx+1)%poet.works.length;draw()};el('small').onclick=()=>{size=Math.max(12,size-1);draw()};el('large').onclick=()=>{size=Math.min(26,size+1);draw()};draw();window.addEventListener('DOMContentLoaded',()=>{if(window.MyeongdoMosaic){window.MyeongdoMosaic.render(el('poem-mosaic-art'),poet.slug,idx,poet.works[idx]);el('poem-mosaic-label').textContent='「'+poet.works[idx]+'」 · 디지털 모자이크 시화';}});</script></body></html>
