</style></head><body><header id="top"><small>MYEONGDOJAE · WOLCHON STATION PEOPLE</small><h1>곽의영 시인 문학관</h1></header><main><a class="back" href="./index.html">← 월촌역 사람들 공동 문학관</a><section class="intro"><h2>시인 소개</h2><p>가족과 삶의 온기를 노래하는 곽의영 시인의 작품을 소개하는 개인 문학관입니다.</p><p class="note">원문이 확인된 작품만 전문을 표시합니다. 미등록 작품은 제목과 준비 안내가 제공됩니다.</p></section><section class="box"><h2>📖 작품 감상</h2><div id="tabs" class="tabs"></div><div class="controls"><button id="prev" class="secondary">이전 작품</button><button id="next" class="secondary">다음 작품</button><button id="small" class="secondary">글자 작게</button><button id="large" class="secondary">글자 크게</button></div><div class="book" id="reading-book"><article class="page"><h3 id="title"></h3><div id="verse" class="verse"></div><div class="controls audio-controls"><button id="read" type="button">▶ 시 읽기</button><button id="stop" type="button" class="secondary">■ 정지</button></div><p id="count" class="note"></p></article><article class="page"><h3>작품 해설</h3><div id="comment" class="verse"></div><div class="controls"><button id="readcomment" type="button">▶ 해설 읽기</button></div><p class="note">명도재 문학관 · 작품 해설</p></article></div><figure class="poem-mosaic" aria-label="선택한 작품의 모자이크 시화"><div id="poem-mosaic-art" class="mosaic-image"></div><figcaption id="poem-mosaic-label">작품별 디지털 모자이크 시화</figcaption><div class="mosaic-top-actions"><a class="mosaic-to-top" href="#top" aria-label="문학관 맨 위로 이동">↑ 맨 위로 가기</a></div></figure></section></main><footer>© 2026 명도재(明道齋) · 기획 이명우</footer><script src="./mosaic-art.js" defer></script><script>const poet={"slug":"gwak-uiyeong","name":"곽의영","subtitle":"하나뿐인 예쁜 딸아","bio":"가족과 삶의 온기를 노래하는 곽의영 시인의 작품을 소개하는 개인 문학관입니다.","works":["하나뿐인 예쁜 딸아","세월이 가르쳐 준 삶의 품격","그림자의 동행","물안개","막걸리를 마시며"],"poem":"나는 너의 이름조차 아끼는 아빠\n너의 이름 아래엔\n행운의 날개가 펄럭인다\n\n웃어서 저절로 얻어진\n공주 천사라는 별명처럼\n아, 너는 천사로 세상에 온 내 딸\n\n빗물 촉촉이 내려\n토사 속에서\n연둣빛 싹이 트는 봄처럼 너는 곱다\n\n예쁜 나이, 예쁜 딸아\n늘 그렇게 곱게 한 송이 꽃으로\n시간을 꽁꽁 묶어 매고 살아라\n\n너는 나에게 지상 최고의 기쁨\n저 넓은 세상에서 큰 꿈을 펼쳐라\n함박꽃 같은 내 딸아.","comment":"「하나뿐인 예쁜 딸아」는 자녀의 성장을 바라보는 아버지의 사랑을 축복의 언어로 표현한다. ‘너의 이름조차 아끼는 아빠’라는 첫 구절은 딸을 소중히 대하는 마음을 드러낸다. ‘행운의 날개’와 ‘공주 천사’는 딸의 존재 자체가 선물임을 보여 준다. 비 온 뒤 돋아나는 연둣빛 싹과 한 송이 꽃은 새로운 생명의 성장과 가능성을 상징한다. ‘시간을 꽁꽁 묶어 매고 살아라’에는 아름다운 순간을 오래 붙잡고 싶은 부모의 소망이 담긴다. 그러나 화자는 마침내 ‘저 넓은 세상에서 큰 꿈을 펼쳐라’라고 말한다. 곁에 두고 싶은 마음을 넘어 스스로의 삶을 펼치도록 응원하는 것이다. 마지막 함박꽃의 이미지는 딸의 앞날에 보내는 넉넉한 사랑과 희망을 밝게 남긴다."};const wisdomWork={"poem":"젊은 날에는 남보다 앞서가는 것이\n잘 사는 인생인 줄 알았습니다.\n세월이 흐르고 보니\n누군가의 마음을 다치게 하지 않고\n내 마음의 평화를 지키는 일이\n더 귀한 삶이라는 것을 알게 됩니다.\n꽃은 피었다고 자랑하지 않고\n나무는 열매 맺었다고 뽐내지 않습니다.\n그저 제 자리에서 계절을 견디며\n자신에게 주어진 삶을 살아갑니다.\n사람도 그랬으면 좋겠습니다.\n가진 것을 드러내기보다\n마음의 깊이를 더하고,\n말을 앞세우기보다\n행동으로 믿음을 남기는 사람.\n나이가 든다는 것은\n단순히 세월을 더하는 일이 아니라\n욕심은 조금씩 덜어 내고\n이해와 너그러움을 채워 가는 일입니다.\n이제는 화려한 박수보다\n진심 어린 눈빛 하나가 좋고,\n수많은 인연보다\n오래도록 마음을 나눌 사람 하나가 좋습니다.\n인생의 품격은 얼마나 높이 올랐느냐가 아니라\n얼마나 깊고 아름답게 익어 가느냐에 있습니다.\n오늘도 세월을 탓하기보다\n세월만큼 마음이 깊어지는\n그런 하루를 살아가고 싶습니다","comment":"「세월이 가르쳐 준 삶의 품격」은 경쟁과 성취에 중심을 두었던 젊은 날의 가치관이 배려와 성숙으로 바뀌는 과정을 담은 산문시다. 화자는 남보다 앞서기보다 타인의 마음을 다치게 하지 않는 삶이 중요하다고 깨닫는다. 꽃이 피어도 자랑하지 않고 나무가 열매를 맺어도 뽐내지 않는다는 자연의 비유는 묵묵한 존재의 품위를 보여 준다. 화려한 박수보다 진심 어린 눈빛 하나를, 많은 인연보다 오래 마음을 나눌 한 사람을 소중히 여기는 대비도 선명하다. 여기서 나이 듦은 단순히 세월을 더하는 일이 아니라 욕심을 덜어 내고 너그러움을 채우는 과정이다. 삶의 가치는 얼마나 높이 올라갔는지가 아니라 얼마나 깊고 아름답게 익어 가는가에 있음을 일깨우는 작품이다."};const shadowWork={"poem":"등 뒤에서 햇살이 툭 밀어주면  \n모래 위에 검은 문장 길게 써진다  \n발목을 서로 묶고 나란히 걷는 길  \n그림자 제 몸 늘려 바다를 본다  \n우리를 여기까지 세운 것은  \n환한 빛만이 아니었다  \n젖은 모래를 꾹꾹 밟아온 그늘  \n끝내 곁을 지킨 질긴 뿌리  \n동행은 마주 보고 웃는 일이 아니라  \n비틀대는 서로를 품어주는 일  \n수평선 너머 빛이 모두 저문 뒤  \n맞잡은 손마디에 별 하나 뜬다","comment":"「그림자의 동행」은 모래 위에 길게 드리운 두 사람의 그림자를 통해 함께 살아온 관계의 의미를 돌아본다. 햇살이 밀어 주자 모래 위에 ‘검은 문장’이 쓰인다는 첫 장면은 몸의 흔적을 삶의 이야기로 바꾸는 은유이다. 발목을 묶고 나란히 걷는 그림자에는 서로의 속도를 맞추는 관계의 책임이 담겼다. ‘우리를 여기까지 세운 것은 / 환한 빛만이 아니었다’는 구절은 동행에 기쁨만 있었던 것이 아님을 보여 준다. 젖은 모래를 밟아 온 그늘은 고단한 시간을, 질긴 뿌리는 서로를 지탱한 힘을 상징한다. ‘비틀대는 서로를 품어주는 일’이라는 진술에서 사랑은 감정을 넘어 돌봄의 실천이 된다. 어둠 속 맞잡은 손에 뜨는 별은 지속되는 연대와 희망의 이미지다."};const mistWork={"poem":"두견새처럼 울며 또 하루를 보냈다\n바람을 가르며 날아오르는 그리움으로\n소리죽여 울며 또 하루를 보냈다\n안개로 피어나는 보고픔으로\n유난히 네가 보고 싶다\n길 잃은 안개가 내 곁에 머물면","comment":"「물안개」는 붙잡을 수 없으면서도 눈앞에 머무는 안개를 통해 그리움의 모습을 그린다. 첫 행의 두견새는 전통적인 서정에서 애절한 울음을 환기하는 이미지이다. ‘또 하루를 보냈다’는 반복은 보고 싶은 마음이 하루하루 쌓이는 시간을 드러낸다. ‘바람을 가르며 날아오르는 그리움’은 위로 솟는 움직임을, ‘안개로 피어나는 보고픔’은 낮게 번지는 감정을 보여 준다. ‘유난히 네가 보고 싶다’는 직접적인 고백은 이 자연 이미지의 중심에 부재한 ‘너’가 있음을 밝힌다. 마지막 ‘길 잃은 안개가 내 곁에 머물면’은 그리움이 잠시 다가온 듯한 순간을 담는다. 현재 확인된 원문은 이 행에서 끝나므로 이 해설도 수록된 구절만을 대상으로 한다."};const makgeolliWork={"poem":"하루가 접힌 뒤에야  \n나는 잔을 든다  \n탁해진 것은 술이 아니라  \n말하지 못한 시간들이다  \n첫 모금에는  \n아직 남아 있는 체온이 있고  \n두 번째쯤에서야  \n오늘이 비로소 내려앉는다  \n잘 산 날보다  \n버틴 날이 많았다는 것을  \n이 술은  \n굳이 묻지 않는다  \n막걸리는  \n비워도 남는 것이 있어  \n나는 천천히  \n밤 쪽으로 기운다.","comment":"「막걸리를 마시며」는 하루의 끝에 마시는 막걸리 한 잔을 통해 삶의 고단함과 말하지 못한 감정을 돌아보는 시다. ‘하루가 접힌 뒤에야’라는 첫 구절에서 하루는 접힌 종이처럼 기억 속에 포개진다. ‘탁해진 것은 술이 아니라 / 말하지 못한 시간들이다’는 막걸리의 뿌연 빛깔을 마음의 응어리와 연결하는 중심 은유이다. 첫 모금에 남은 체온과 두 번째 모금에 내려앉는 오늘은 잔에 담긴 하루의 무게를 느끼게 한다. ‘잘 산 날보다 / 버틴 날이 많았다’는 고백에는 성취보다 견딤이 많았던 생애에 대한 담담한 인정이 있다. 술이 ‘굳이 묻지 않는다’는 표현은 판단 없는 위로를 뜻한다. 밤 쪽으로 천천히 기우는 결말은 하루를 내려놓는 조용한 몸짓이다."};let idx=0,size=16;const el=id=>document.getElementById(id);function draw(){el('tabs').innerHTML='';poet.works.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w;b.className=i===idx?'':'secondary';b.type='button';b.setAttribute('aria-pressed',String(i===idx));b.onclick=()=>{if(idx===i){document.getElementById('reading-book').scrollIntoView({behavior:'smooth',block:'start'});return;}stopAudio();idx=i;draw();document.getElementById('reading-book').scrollIntoView({behavior:'smooth',block:'start'})};el('tabs').append(b)});const w=poet.works[idx];el('title').textContent=poet.name+' · '+w;el('verse').textContent=idx===0?poet.poem:idx===1?wisdomWork.poem:idx===2?shadowWork.poem:idx===3?mistWork.poem:makgeolliWork.poem;el('comment').textContent=idx===0?poet.comment:idx===1?wisdomWork.comment:idx===2?shadowWork.comment:idx===3?mistWork.comment:makgeolliWork.comment;el('count').textContent=(idx+1)+' / '+poet.works.length;el('verse').style.fontSize=size+'px';el('comment').style.fontSize=size+'px';if(window.MyeongdoMosaic){window.MyeongdoMosaic.render(el('poem-mosaic-art'),poet.slug,idx,w);el('poem-mosaic-label').textContent='「'+w+'」 · 디지털 모자이크 시화';}}let activeAudio=null,activeType=null,audioState='idle',audioChunks=[],audioChunkIndex=0,audioOffset=0,audioToken=0;
function audioButtonState(){
 const poem=el('read'),comment=el('readcomment');
 const label=(type,name)=>activeType===type&&audioState==='playing'?'⏸ '+name+' 일시정지':activeType===type&&audioState==='paused'?'▶ '+name+' 이어 읽기':'▶ '+name+' 읽기';
 poem.textContent=label('poem','시');comment.textContent=label('comment','해설');
 poem.setAttribute('aria-pressed',String(activeType==='poem'&&audioState==='playing'));
 comment.setAttribute('aria-pressed',String(activeType==='comment'&&audioState==='playing'));
}
function splitForSpeech(text){
 const pieces=[];
 // 짧은 문장과 행으로 나누어, 모바일 엔진이 pause 상태를 지워도
 // 마지막 발화 지점부터 복원할 수 있도록 한다.
 for(const line of text.split(/\n+/)){
  const trimmed=line.trim();if(!trimmed)continue;
  const sentences=trimmed.match(/[^.!?。！？]+[.!?。！？]*\s*/g)||[trimmed];
  for(const s of sentences){
   let rest=s.trim();
   while(rest.length>75){
    let cut=rest.lastIndexOf(' ',75);
    if(cut<25)cut=75;
    pieces.push(rest.slice(0,cut).trim());
    rest=rest.slice(cut).trim();
   }
   if(rest)pieces.push(rest);
  }
 }
 return pieces;
}
function clearSpeech(){
 activeAudio=null;activeType=null;audioState='idle';audioChunks=[];audioChunkIndex=0;audioOffset=0;audioToken++;
 if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}
 audioButtonState();
}
function playSpeechChunk(){
 if(audioState!=='playing')return;
 if(audioChunkIndex>=audioChunks.length){clearSpeech();return;}
 const chunk=audioChunks[audioChunkIndex];
 const start=Math.max(0,Math.min(audioOffset,chunk.length));
 const remaining=chunk.slice(start);
 if(!remaining.trim()){audioChunkIndex++;audioOffset=0;playSpeechChunk();return;}
 const token=++audioToken;
 const u=new SpeechSynthesisUtterance(remaining);
 u.lang='ko-KR';u.rate=.87;
 const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));if(voices.length)u.voice=voices[0];
 u.onboundary=e=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  if(typeof e.charIndex==='number')audioOffset=Math.max(audioOffset,start+e.charIndex);
 };
 u.onend=()=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  activeAudio=null;audioChunkIndex++;audioOffset=0;playSpeechChunk();
 };
 u.onerror=()=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  // 오류가 나면 처음부터 재생하지 않도록 기존 진행 위치를 유지한다.
  activeAudio=null;audioState='paused';audioButtonState();
 };
 activeAudio=u;audioButtonState();
 try{speechSynthesis.speak(u)}catch(e){activeAudio=null;audioState='paused';audioButtonState()}
}
function toggleAudio(type){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert('음성 읽기를 지원하지 않습니다. 크롬에서 열어 주세요.');return;}
 if(activeType===type&&audioState==='playing'){
  // Android Chrome에서 pause/resume이 멈출 수 있어 현재 위치를 기억하고
  // 발화를 취소한다. 다음 클릭은 그 위치부터 새로운 발화로 시작한다.
  audioState='paused';activeAudio=null;audioToken++;
  try{speechSynthesis.cancel()}catch(e){}
  audioButtonState();return;
 }
 if(activeType===type&&audioState==='paused'){
  audioState='playing';audioButtonState();playSpeechChunk();return;
 }
 clearSpeech();
 const text=(type==='poem'?el('verse'):el('comment')).textContent;
 audioChunks=splitForSpeech(text);if(!audioChunks.length)return;
 activeType=type;audioState='playing';audioChunkIndex=0;audioOffset=0;
 audioButtonState();playSpeechChunk();
}
