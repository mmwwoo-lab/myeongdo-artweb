</style></head><body><header id="top"><small>MYEONGDOJAE · WOLCHON STATION PEOPLE</small><h1>전진식 시인 문학관</h1></header><main><a class="back" href="./index.html">← 월촌역 사람들 공동 문학관</a><section class="intro"><h2>시인 소개</h2><p>일상의 사물과 삶의 결을 서정적으로 응시하는 전진식 시인의 개인 문학관입니다.</p><p class="note">원문이 확보된 「가을 분실물」을 전문 수록했습니다. 검증되지 않은 제목은 목차에서 제외했습니다.</p></section><section class="box"><h2>📖 작품 감상</h2><div id="tabs" class="tabs"></div><div class="controls"><button id="prev" class="secondary">이전 작품</button><button id="next" class="secondary">다음 작품</button><button id="small" class="secondary">글자 작게</button><button id="large" class="secondary">글자 크게</button></div><div class="book" id="reading-book"><article class="page"><h3 id="title"></h3><div id="verse" class="verse"></div><div class="controls audio-controls"><button id="read" type="button">▶ 시 읽기</button><button id="stop" type="button" class="secondary">■ 정지</button></div><p id="count" class="note"></p></article><article class="page"><h3>작품 해설</h3><div id="comment" class="verse"></div><div class="controls"><button id="readcomment" type="button">▶ 해설 읽기</button></div><p class="note">명도재 문학관 · 작품 해설</p></article></div><figure class="poem-mosaic" aria-label="선택한 작품의 모자이크 시화"><div id="poem-mosaic-art" class="mosaic-image"></div><figcaption id="poem-mosaic-label">작품별 디지털 모자이크 시화</figcaption><div class="mosaic-top-actions"><a class="mosaic-to-top" href="#top" aria-label="문학관 맨 위로 이동">↑ 맨 위로 가기</a></div></figure></section></main><footer>© 2026 명도재(明道齋) · 기획 이명우</footer><script src="./mosaic-art.js" defer></script><script>const poet={"slug":"jeon-jinsik","name":"전진식","subtitle":"가을 분실물","bio":"일상의 사물과 삶의 결을 서정적으로 응시하는 전진식 시인의 개인 문학관입니다.","works":["가을 분실물","신기루","엄마 생각","상사화","휘날리는 태극기는","강"],"poem":"분실물 센터를 찾았다\n\n방문을 꼭 닫고 있는데도\n바람이 어깨깃에 스민다\n\n잃어버린 것도 없는데\n자꾸 뒤적거려보는\n빈 주머니\n\n가을이다.","comment":"「가을 분실물」은 잃어버린 것이 없는데도 무엇인가를 찾는 마음을 통해 계절의 상실감을 표현한다. 첫 행의 ‘분실물 센터’는 물건을 되찾는 현실적 공간이지만, 화자가 찾아 나선 것은 이름 붙일 수 없는 마음의 빈자리다. 문을 꼭 닫아도 스며드는 바람은 세월과 계절의 변화를 누구도 막을 수 없음을 암시한다. ‘잃어버린 것도 없는데’라는 부정과 ‘빈 주머니’를 뒤지는 행동은 이성의 판단과 몸의 감각이 어긋나는 역설을 이룬다. 마지막 ‘가을이다.’는 그 허전함의 정체를 설명하는 대신 하나의 계절로 압축한다. 짧은 행과 넉넉한 여백은 독자가 자신의 상실과 그리움을 떠올리게 한다. 일상의 작은 행동으로 삶의 깊은 정서를 환기하는 절제의 시학이 돋보인다."};const newWork={"poem":"돌개바람에 휘감기는\n먼지가루\n호작질이다\n둥둥\n동그라미도 날렸고\n추락하는 새의 깃털도 뽑아 보았다\n지평선 위로 지는 노을이 고왔고\n골목을 돌아\n휘파람 소리가 들렸다\n가을이 지고 있다","comment":"「신기루」는 돌개바람과 먼지가 만들어 내는 순간적인 형상으로 사라지는 시간과 계절을 바라본다. ‘호작질이다’라는 구어적 표현과 ‘둥둥’, ‘동그라미’ 같은 말에는 장난스럽고 가벼운 움직임이 담겼다. 그러나 ‘추락하는 새의 깃털’이 등장하면서 경쾌했던 풍경에는 소멸의 그림자가 드리운다. 먼지가 흩어지고 노을이 지며 골목 너머 휘파람 소리가 들리는 장면은 모두 잠깐 나타났다 사라지는 것들이다. 이러한 이미지가 이어지며 제목 ‘신기루’는 눈앞의 허상뿐 아니라 되돌릴 수 없는 순간의 표상이 된다. 마지막 ‘가을이 지고 있다’는 노을의 저묾과 계절의 끝을 한 문장에 겹친다. 감각적 장면들의 병치로 시간의 덧없음을 전하는 시다."};const momWork={"poem":"강아지 두 마리가 이사를 왔다\n밤새 낑낑거리더니\n아침 햇살에\n몸을 부벼대다가\n서로 턱을 고이고 눈을 감고 있다\n어린 시절\n배가 고파서 칭얼대며\n아랫목에 웅크려 잠이 든 동생들이 생각났다\n엄마는\n어제 뜯어 놓은 산나물을 머리에 이고\n새벽 일찍\n종종걸음으로 재 넘어 장터로 갔다\n해가 질 무렵\n보리쌀 한 되박을 가슴에 안고 돌아왔다","comment":"「엄마 생각」은 이사 온 강아지 두 마리의 모습을 통해 가난했던 유년과 어머니의 고단한 삶을 불러낸다. 강아지들이 서로 몸을 부비고 턱을 고인 채 잠드는 모습은 아랫목에서 배고픔을 견디며 웅크려 잠들던 동생들의 모습과 겹쳐진다. 현재의 작은 풍경이 과거의 기억을 여는 자연스러운 계기가 되는 것이다. 시의 시선은 이어 산나물을 머리에 이고 새벽 장터로 향한 어머니에게 옮겨 간다. 저녁 무렵 ‘보리쌀 한 되박’을 가슴에 안고 돌아오는 어머니의 모습에는 가족을 먹이기 위해 버텨 낸 하루가 담겨 있다. 시인은 어머니의 희생을 과장된 말로 찬양하지 않고 구체적인 생활 장면으로 보여 준다. 사물과 몸짓을 통해 가난의 기억과 모성의 깊이를 복원하는 작품이다."};const sangsaWork={"poem":"사랑을 하면서도\n사랑하면 아니 된다는 그런 사랑을 두고\n소쩍새는 밤을 새워 울었다\n보고 있어도 보고 싶다는\n사랑의 굴레 같은 것은 아니라고\n한 번은 무너져야 할 이별이란 단어를,\n또 한 번은\n너 아니면 아니라고 애틋한 번뇌로\n잎은 지고\n꽃이 핀다\n징금다리를 건너면서\n손을 나란히 할 수 없는 비애悲哀에\n촉촉이 비가 내려\n비야\n비야\n한 열흘만 내려다오\n우산도 없이\n비를  맞고 있다","comment":"「상사화」는 사랑하면서도 함께할 수 없는 관계의 슬픔을 잎과 꽃이 만나지 못하는 상사화의 이미지에 담았다. 첫머리의 ‘사랑하면 아니 된다는’ 고백은 마음과 현실의 금지 사이에서 갈등하는 화자의 처지를 드러낸다. 소쩍새의 울음은 그리움의 정서를 깊게 하고, ‘잎은 지고 / 꽃이 핀다’는 짧은 구절은 만남의 불가능성을 자연의 질서로 형상화한다. ‘징금다리’를 건너면서도 손을 나란히 할 수 없는 장면에는 관계의 거리가 구체적인 몸짓으로 나타난다. 마지막 ‘비야 / 비야’의 반복은 애절한 호소처럼 울린다. 우산도 없이 비를 맞는 화자의 모습은 상처를 피하지 않고 견디려는 태도를 보여 준다. 자연 이미지와 직접적인 고백이 만나 이별의 비애를 선명히 전한다."};const flagWork={"poem":"만세 소리\n또 만세 소리\n삼천리 방방곡곡 무궁화 만만세\n울어 울었던 세월로\n뜨겁게 불러보는 그리운 이름들\n님아~\n잊었던 주검들도 일제히 일어서며\n서러운 감격으로 목이 매인 광복\n눈 감으면\n다들 어디에.......\n총소리 고함소리 피맺힌 원한인데\n여보게\n이 소리 들리는가\n원성을 풀어 한맺힌 함성을 들어보세\n골목마다 어귀마다\n어깨동무 내 동무\n바람도 함께하는 태극기 물결\n님아~\n내 사랑 파아란 하늘\n푸르른 자유\n동해와 백두에는 해가 뜨는데\n님아~ 님아~\n내 죽어도 그리울 님아","comment":"「휘날리는 태극기는」은 광복의 기쁨과 그날에 이르기까지 희생된 사람들에 대한 애도를 함께 노래한다. ‘만세 소리 / 또 만세 소리’라는 반복은 개인의 목소리가 공동체의 함성으로 커지는 장면을 만든다. 그러나 ‘잊었던 주검들’과 ‘총소리 고함소리’는 환희의 뒤편에 놓인 역사적 고통을 불러낸다. 거듭되는 ‘님아~’의 호명은 이제 곁에 없는 사람에게 말을 거는 애도의 형식이다. 골목마다 이어지는 어깨동무와 태극기의 물결은 자유를 맞이한 이들의 연대를 상징한다. 결말의 ‘파아란 하늘’과 ‘푸르른 자유’는 희생으로 얻은 삶의 가치를 밝게 보여 준다. 시는 역사적 승리의 기억이 고통과 희생의 기억을 함께 품어야 함을 일깨운다."};const riverWork={"poem":"강은\n천년만년을 가슴으로 흘러갑니다\n사람들에겐 그리움이란 게 너무 많지 만\n간절한 이름 하나 지우지 못한  \n한(恨)의 그리움은\n강물로 만 흘러갑니다\n해질녁에 옥상에 오르면 그리움이 보입니다\n휘파람을 불면 꽃이파리가 날리고\n못다한 이야기도\n강물 위의 노을로 옵니다\n모두가  그리움입니다\n이런 날은 차라리 눈을 감습니다\n    보지 않고 보는 것이\n    가장 아름다운 그리움입니다\n가까이 있거나 멀리 있어도\n강은 가슴으로 흘러갑니다\n때로는\n애절한 이름 하나 부르지 못하고\n세월로 흘러갑니다","comment":"「강」은 끊임없이 흐르는 물을 지울 수 없는 그리움과 세월의 상징으로 삼는다. ‘강은 / 천년만년을 가슴으로 흘러갑니다’라는 첫머리는 자연의 강을 인간 내면에 흐르는 정서로 바꾼다. 화자에게는 잊지 못한 ‘간절한 이름 하나’가 있으며, 강물은 그 이름을 지우기보다 오래 품고 흐르는 시간에 가깝다. 해 질 녘 옥상에서 바라보는 풍경과 휘파람, 꽃잎, 노을은 ‘못다 한 이야기’를 다시 떠오르게 한다. ‘보지 않고 보는 것이 / 가장 아름다운 그리움’이라는 역설은 눈앞에 없는 이를 기억 속에서 더 선명히 만날 수 있음을 말한다. 마지막에 이름을 부르지 못한 채 세월로 흘러가는 모습은 표현되지 않은 감정의 지속을 보여 준다. 강은 결국 화자의 가슴속에 남은 마음의 길이다."};let idx=0,size=16;const el=id=>document.getElementById(id);function draw(){el('tabs').innerHTML='';poet.works.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w;b.className=i===idx?'':'secondary';b.type='button';b.setAttribute('aria-pressed',String(i===idx));b.onclick=()=>{if(idx===i){document.getElementById('reading-book').scrollIntoView({behavior:'smooth',block:'start'});return;}stopAudio();idx=i;draw();document.getElementById('reading-book').scrollIntoView({behavior:'smooth',block:'start'})};el('tabs').append(b)});const w=poet.works[idx];el('title').textContent=poet.name+' · '+w;el('verse').textContent=idx===0?poet.poem:idx===1?newWork.poem:idx===2?momWork.poem:idx===3?sangsaWork.poem:idx===4?flagWork.poem:riverWork.poem;el('comment').textContent=idx===0?poet.comment:idx===1?newWork.comment:idx===2?momWork.comment:idx===3?sangsaWork.comment:idx===4?flagWork.comment:riverWork.comment;el('count').textContent=(idx+1)+' / '+poet.works.length;el('verse').style.fontSize=size+'px';el('comment').style.fontSize=size+'px';if(window.MyeongdoMosaic){window.MyeongdoMosaic.render(el('poem-mosaic-art'),poet.slug,idx,w);el('poem-mosaic-label').textContent='「'+w+'」 · 디지털 모자이크 시화';}}let activeAudio=null,activeType=null,audioState='idle',audioChunks=[],audioChunkIndex=0,audioOffset=0,audioToken=0;
function audioButtonState(){
 const poem=el('read'),comment=el('readcomment');
 const label=(type,name)=>activeType===type&&audioState==='playing'?'⏸ '+name+' 일시정지':activeType===type&&audioState==='paused'?'▶ '+name+' 이어 읽기':'▶ '+name+' 읽기';
 poem.textContent=label('poem','시');comment.textContent=label('comment','해설');
 poem.setAttribute('aria-pressed',String(activeType==='poem'&&audioState==='playing'));
 comment.setAttribute('aria-pressed',String(activeType==='comment'&&audioState==='playing'));
}
function splitForSpeech(text){
 const pieces=[];
 // 짧은 문장과 행으로 나누어, 모바일 엔진이 pause 상태를 지워도
 // 마지막 발화 지점부터 복원할 수 있도록 한다.
 for(const line of text.split(/\n+/)){
  const trimmed=line.trim();if(!trimmed)continue;
  const sentences=trimmed.match(/[^.!?。！？]+[.!?。！？]*\s*/g)||[trimmed];
  for(const s of sentences){
   let rest=s.trim();
   while(rest.length>75){
    let cut=rest.lastIndexOf(' ',75);
    if(cut<25)cut=75;
    pieces.push(rest.slice(0,cut).trim());
    rest=rest.slice(cut).trim();
   }
   if(rest)pieces.push(rest);
  }
 }
 return pieces;
}
function clearSpeech(){
 activeAudio=null;activeType=null;audioState='idle';audioChunks=[];audioChunkIndex=0;audioOffset=0;audioToken++;
 if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}
 audioButtonState();
}
function playSpeechChunk(){
 if(audioState!=='playing')return;
 if(audioChunkIndex>=audioChunks.length){clearSpeech();return;}
 const chunk=audioChunks[audioChunkIndex];
 const start=Math.max(0,Math.min(audioOffset,chunk.length));
 const remaining=chunk.slice(start);
 if(!remaining.trim()){audioChunkIndex++;audioOffset=0;playSpeechChunk();return;}
 const token=++audioToken;
 const u=new SpeechSynthesisUtterance(remaining);
 u.lang='ko-KR';u.rate=.87;
 const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));if(voices.length)u.voice=voices[0];
 u.onboundary=e=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  if(typeof e.charIndex==='number')audioOffset=Math.max(audioOffset,start+e.charIndex);
 };
 u.onend=()=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  activeAudio=null;audioChunkIndex++;audioOffset=0;playSpeechChunk();
 };
 u.onerror=()=>{
  if(token!==audioToken||activeAudio!==u||audioState!=='playing')return;
  // 오류가 나면 처음부터 재생하지 않도록 기존 진행 위치를 유지한다.
  activeAudio=null;audioState='paused';audioButtonState();
 };
 activeAudio=u;audioButtonState();
 try{speechSynthesis.speak(u)}catch(e){activeAudio=null;audioState='paused';audioButtonState()}
}
function toggleAudio(type){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert('음성 읽기를 지원하지 않습니다. 크롬에서 열어 주세요.');return;}
 if(activeType===type&&audioState==='playing'){
  // Android Chrome에서 pause/resume이 멈출 수 있어 현재 위치를 기억하고
  // 발화를 취소한다. 다음 클릭은 그 위치부터 새로운 발화로 시작한다.
  audioState='paused';activeAudio=null;audioToken++;
  try{speechSynthesis.cancel()}catch(e){}
  audioButtonState();return;
 }
 if(activeType===type&&audioState==='paused'){
  audioState='playing';audioButtonState();playSpeechChunk();return;
 }
 clearSpeech();
 const text=(type==='poem'?el('verse'):el('comment')).textContent;
 audioChunks=splitForSpeech(text);if(!audioChunks.length)return;
 activeType=type;audioState='playing';audioChunkIndex=0;audioOffset=0;
 audioButtonState();playSpeechChunk();
}
const stopAudio=clearSpeech;
el('read').onclick=()=>toggleAudio('poem');
el('readcomment').onclick=()=>toggleAudio('comment');
el('stop').onclick=clearSpeech;
document.querySelector('.mosaic-to-top').addEventListener('click',()=>{
 clearSpeech();
 document.querySelectorAll('audio').forEach(a=>{try{a.pause();a.currentTime=0}catch(e){}});
});
window.addEventListener('pagehide',clearSpeech);
el('prev').onclick=()=>{stopAudio();idx=(idx-1+poet.works.length)%poet.works.length;draw()};el('next').onclick=()=>{stopAudio();idx=(idx+1)%poet.works.length;draw()};el('small').onclick=()=>{size=Math.max(12,size-1);draw()};el('large').onclick=()=>{size=Math.min(26,size+1);draw()};draw();window.addEventListener('DOMContentLoaded',()=>{if(window.MyeongdoMosaic){window.MyeongdoMosaic.render(el('poem-mosaic-art'),poet.slug,idx,poet.works[idx]);el('poem-mosaic-label').textContent='「'+poet.works[idx]+'」 · 디지털 모자이크 시화';}});</script></body></html>
