name: Audit MYEONGDOJAE Website and Editor
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin/**"
      - "artist-gallery/**"
      - "exhibitions/**"
      - "culture-news/**"
      - "literature/**"
      - "tests/**"
      - ".github/workflows/audit-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check local links and resources across the site
        run: python tests/audit_site.py
      - name: Check admin JavaScript syntax
        run: node --check admin/app.js
      - name: Install lightweight test DOM
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Test editor, save, preview, video registration, artist links
        run: node tests/test_studio.cjs
      - name: Observe public and external exhibition link status
        run: python tests/check_public_links.py
